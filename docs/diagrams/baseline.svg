<rect width="1400" height="760" fill="#f4f7fb"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:31px;font-weight:700;fill:#142c45}.sub{font-size:17px;fill:#50647a}.head{font-size:20px;font-weight:700;fill:#142c45}.line{font-size:16px;fill:#50647a}.tag{font-size:13px;font-weight:700;fill:#155e75}.label{font-size:14px;fill:#334c65}</style>
<text x="55" y="65" class="title">Baseline: business records depend on one VM</text><text x="55" y="100" class="sub">Application workload and the original recovery dependency</text>
<rect x="490" y="170" width="490" height="415" rx="20" fill="#e7eef6" stroke="#a6b7c9" stroke-dasharray="8 5"/><text x="515" y="201" class="tag">ONE PROXMOX VM / TRUSTED LAN</text><rect x="55" y="270" width="285" height="130" rx="14" fill="white" stroke="#c9d5e3"/><rect x="55" y="270" width="6" height="130" rx="3" fill="#155e75"/><text x="75" y="296" class="tag">ACCESS</text><text x="75" y="323" class="head">Staff workstation</text><text x="75" y="353" class="line">Repair intake and collection</text><text x="75" y="378" class="line">SSH tunnel to loopback</text><rect x="535" y="235" width="400" height="130" rx="14" fill="white" stroke="#c9d5e3"/><rect x="535" y="235" width="6" height="130" rx="3" fill="#155e75"/><text x="555" y="261" class="tag">APPLICATION</text><text x="555" y="288" class="head">Repair workflow</text><text x="555" y="318" class="line">Python service / systemd</text><text x="555" y="343" class="line">Authenticated forms</text><rect x="535" y="415" width="400" height="125" rx="14" fill="white" stroke="#c9d5e3"/><rect x="535" y="415" width="6" height="125" rx="3" fill="#155e75"/><text x="555" y="441" class="tag">BUSINESS DATA</text><text x="555" y="468" class="head">SQLite records</text><text x="555" y="498" class="line">IDs, device, status, UTC time</text><text x="555" y="523" class="line">WAL-backed persistence</text><rect x="1050" y="260" width="290" height="210" rx="14" fill="white" stroke="#c9d5e3"/><rect x="1050" y="260" width="6" height="210" rx="3" fill="#c77d22"/><text x="1070" y="286" class="tag">BASELINE RISK</text><text x="1070" y="313" class="head">Failure boundary</text><text x="1070" y="343" class="line">App and records on one VM</text><text x="1070" y="368" class="line">Manual configuration</text><text x="1070" y="393" class="line">No scheduled off-host copy</text><text x="1070" y="418" class="line">No operational alarms</text><path d="M340,335 H535" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="319" class="label">Encrypted tunnel</text><path d="M735,365 V415" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="395" class="label">Transactions</text><path d="M980,365 H1050" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="55" y="725" class="sub">Proxmox baseline used in the migration lab; see evidence record for provenance.</text></svg>